Image:
  Os: {{ os }}
HeadNode:
  InstanceType: c5.xlarge
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Dcv:
    Enabled: true
    Port: {{ dcv_port }}
    AllowedIps: {{ access_from }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: queue-0
      CapacityType: CAPACITY_BLOCK
      ComputeResources:
        - Name: compute-resource-0
          InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: 1
          CapacityReservationTarget:
            CapacityReservationId: cr-0126390e81fd28658
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
