Image:
  Os: {{ os }}
HeadNode:
  # Use multi-NIC instance type from https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-eni.html
  InstanceType: c6in.32xlarge
  Networking:
    SubnetId: {{ public_subnet_id }}
    ElasticIp: true
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  {% if scheduler == "awsbatch" %}AwsBatchQueues:{% else %}SlurmQueues:{% endif %}
    - Name: queue-0
      CapacityType: CAPACITY_BLOCK
      CapacityReservationTarget:
        CapacityReservationId: cr-0126390e81fd28658
      CustomSlurmSettings:
        Sockets: 2
        CoresPerSocket: 48
      ComputeResources:
        - Name: compute-resource-0
          {% if scheduler == "awsbatch" %}
          InstanceTypes:
            - {{ instance }}
          MinvCpus: 4
          {% else %}
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 2
          MaxCount: 2
          Efa:
            Enabled: true
          {% endif %}
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
        {% if scheduler != "awsbatch" %}
        PlacementGroup:
          Enabled: false
        {% endif %}
SharedStorage:
  - MountDir: /shared
    Name: name1
    StorageType: Ebs
