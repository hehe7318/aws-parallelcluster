Image:
  Os: {{ os }}
HeadNode:
  InstanceType: c5.xlarge
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Iam:
    InstanceRole: {{ ec2_iam_role }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  {% if scheduler == "awsbatch" %}AwsBatchQueues:{% else %}SlurmQueues:{% endif %}
    - Name: queue-0
      CapacityType: CAPACITY_BLOCK
      CapacityReservationTarget:
        CapacityReservationId: cr-0126390e81fd28658
      ComputeResources:
        - Name: compute-resource-0
          InstanceType: {{ instance }}
          MinCount: 2
          MaxCount: 2
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
      {% if scheduler != "awsbatch" %}
      Iam:
        InstanceRole: {{ ec2_iam_role }}
      {% endif %}
SharedStorage:
  - MountDir: {{ mount_dir }}
    StorageType: Ebs
    Name: ebs
    EbsSettings:
      Iops: 210
      VolumeType: io1
      Encrypted: true
      KmsKeyId: {{ ebs_kms_key_id }}
