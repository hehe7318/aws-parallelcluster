Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ head_node_instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: efa-enabled
      CapacityType: CAPACITY_BLOCK
      Networking:
        PlacementGroup:
          Enabled: false
        SubnetIds:
          - {{ private_subnet_id }}
      ComputeResources:
        - Name: efa-enabled-i1
          InstanceType: {{ instance }}
          MaxCount: 2
          MinCount: 2
          DisableSimultaneousMultithreading: true
          Efa:
            Enabled: true
          CapacityReservationTarget:
            CapacityReservationId: cr-0126390e81fd28658
SharedStorage:
  - MountDir: /shared
    Name: name1
    StorageType: Ebs
