Image:
  Os: {{ os }}
HeadNode:
  InstanceType: {{ instance }}
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  SlurmQueues:
    - Name: compute
      ComputeResources:
        - Name: cit
          Instances:
            - InstanceType: {{ instance }}
          MinCount: 2
          MaxCount: 150
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
SharedStorage:
  - MountDir: /shared
    Name: pcluster-efs
    StorageType: Efs
    EfsSettings:
      FileSystemId: fs-051f8793ae7aaf0f7
DirectoryService:
  DomainName: {{ domain_name }}
  DomainAddr: {{ ldap_uri }}
  PasswordSecretArn: {{ password_secret_arn }}
  DomainReadOnlyUser: {{ domain_read_only_user }}
  LdapTlsCaCert: {{ ldap_tls_ca_cert }}
  LdapTlsReqCert: {{ ldap_tls_req_cert }}
  GenerateSshKeysForUsers: true
  AdditionalSssdConfigs:
    debug_level: "0x1ff"
    override_homedir: "/shared/home/%u"
    {% if directory_protocol == "ldap" %}
    ldap_auth_disable_tls_never_use_in_production: True
    {% endif %}
