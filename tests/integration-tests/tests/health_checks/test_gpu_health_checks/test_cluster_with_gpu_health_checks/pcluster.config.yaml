Image:
  Os: {{ os }}
HeadNode:
  InstanceType: c5.xlarge
  Networking:
    SubnetId: {{ public_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: slurm
  SlurmQueues:
  - Name: queue-1
    HealthChecks:
      Gpu:
        Enabled: true
    CapacityType: CAPACITY_BLOCK
    ComputeResources:
#    - Name: compute-resource-1
#      Instances:
#        - InstanceType: g4dn.xlarge
#      HealthChecks:
#        Gpu:
#          Enabled: false
    - Name: compute-resource-2
      InstanceType: {{ instance }}
      MinCount: 2
      MaxCount: 2
      HealthChecks:
        Gpu:
          Enabled: true
      CapacityReservationTarget:
        CapacityReservationId: cr-0126390e81fd28658
    Networking:
      SubnetIds:
        - {{ private_subnet_id }}
