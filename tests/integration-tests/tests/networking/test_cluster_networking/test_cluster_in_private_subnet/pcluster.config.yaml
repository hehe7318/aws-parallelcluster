Image:
  Os: {{ os }}
HeadNode:
  InstanceType: c5.xlarge
  Networking:
    SubnetId: {{ private_subnet_id }}
  Ssh:
    KeyName: {{ key_name }}
    AllowedIps: 0.0.0.0/0
  Imds:
    Secured: {{ imds_secured }}
Scheduling:
  Scheduler: {{ scheduler }}
  {% if scheduler == "awsbatch" %}AwsBatchQueues:{% else %}SlurmQueues:{% endif %}
    - Name: queue-0
      CapacityType: CAPACITY_BLOCK
      CapacityReservationTarget:
        CapacityReservationId: cr-0126390e81fd28658
      ComputeResources:
        - Name: compute-resource-0
          InstanceType: {{ instance }}
          MinCount: 1
          MaxCount: 1
      Networking:
        SubnetIds:
          - {{ private_subnet_id }}
SharedStorage:
  - MountDir: {{ mount_dir }}
    Name: privatestorage
    {% if storage_type == "EFS" %}
    StorageType: Efs
    {% endif %}
    {% if storage_type == "FSX" %}
    StorageType: FsxLustre
    FsxLustreSettings:
      StorageCapacity: 1200
      DeploymentType: SCRATCH_2
    {% endif %}
DeploymentSettings:
  LambdaFunctionsVpcConfig:
    SecurityGroupIds:
    - {{ default_vpc_security_group_id }}
    SubnetIds:
    - {{ private_subnet_id }}
